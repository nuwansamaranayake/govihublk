<meta charset="UTF-8">

<title>GoviHub Spices — ශ්‍රී ලංකා කෘෂිකර්මාන්තයට ස්මාර්ට් ගොවිතැන් තාක්ෂණය</title>
<meta name="description" content="කුළුබඩු අංශයෙන් ආරම්භ වූ ජාතික ස්මාර්ට් ගොවිතැන් මූලපිරීම — AI ගැලපීම්, රෝග හඳුනාගැනීම, කාලගුණ බුද්ධිය. ගොවියාට සදහටම නොමිලේ.">
<!-- Open Graph / social sharing -->
<meta property="og:type" content="website">
<meta property="og:title" content="GoviHub Spices — ස්මාර්ට් ගොවිතැන් තාක්ෂණය">
<meta property="og:description" content="UN ITC පිළිගත් ශ්‍රී ලාංකික AI ගොවිතැන් වේදිකාව — ඉදිරිපත් කිරීම බලන්න. ගොවියාට සදහටම නොමිලේ.">

<meta name="theme-color" content="#1A202C">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #1A202C; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  .stage { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .viewer { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
  .frame { position: relative; width: min(100vw, calc((100vh - 88px) * 16 / 9)); aspect-ratio: 16 / 9; background: #10151d; }
  .frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain;
    opacity: 0; transition: opacity .35s ease; }
  .frame img.active { opacity: 1; }
  .nav { position: absolute; top: 0; bottom: 0; width: 22%; cursor: pointer; z-index: 5;
    display: flex; align-items: center; border: 0; background: transparent; color: transparent; }
  .nav:hover span, .nav:focus-visible span { opacity: 1; }
  .nav span { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px;
    border-radius: 50%; background: rgba(26,32,44,.75); color: #E8A838; font-size: 26px; opacity: 0;
    transition: opacity .2s; user-select: none; }
  .nav.prev { left: 0; justify-content: flex-start; padding-left: 14px; }
  .nav.next { right: 0; justify-content: flex-end; padding-right: 14px; }
  .bar { height: 88px; display: flex; align-items: center; justify-content: center; gap: 16px;
    padding: 0 16px; background: #131923; border-top: 2px solid #E8A838; }
  .counter { color: #fff; font-size: 15px; font-variant-numeric: tabular-nums; min-width: 64px; text-align: center; }
  .dots { display: flex; gap: 6px; flex-wrap: nowrap; overflow-x: auto; max-width: 46vw; scrollbar-width: none; }
  .dots::-webkit-scrollbar { display: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #3a4556; border: 0; padding: 0; cursor: pointer; flex: 0 0 auto; }
  .dot.on { background: #E8A838; transform: scale(1.25); }
  .btn { background: #2D6A2E; color: #fff; border: 0; border-radius: 8px; padding: 9px 14px;
    font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn.gold { background: transparent; color: #E8A838; border: 1px solid #E8A838; }
  .btn:active { transform: scale(.97); }
  .brand { position: absolute; top: 12px; right: 14px; z-index: 6; color: rgba(255,255,255,.55);
    font-size: 12px; letter-spacing: .04em; pointer-events: none; }
  @media (max-width: 640px) {
    .bar { height: 76px; gap: 10px; }
    .dots { display: none; }
    .btn { padding: 8px 11px; font-size: 13px; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="viewer" id="viewer">
    <div class="brand">GoviHub Spices</div>
    <div class="frame" id="frame"></div>
    <button class="nav prev" id="prev" aria-label="පෙර පිටුව"><span>&#10094;</span></button>
    <button class="nav next" id="next" aria-label="ඊළඟ පිටුව"><span>&#10095;</span></button>
  </div>
  <div class="bar">
    <div class="counter" id="counter">1 / 19</div>
    <div class="dots" id="dots"></div>
    <button class="btn" id="visit" onclick="window.open('https://spices.govihublk.com','_blank')">GoviHub වෙත</button>
    <button class="btn gold" id="fs">Fullscreen</button>
    <button class="btn gold" id="share">Share</button>
  </div>
</div>
<script>
(function () {
  const N = 19;
  const frame = document.getElementById('frame');
  const dotsEl = document.getElementById('dots');
  const counter = document.getElementById('counter');
  const imgs = [], dots = [];
  let cur = 0;

  for (let i = 0; i < N; i++) {
    const img = document.createElement('img');
    img.alt = 'Slide ' + (i + 1);
    img.decoding = 'async';
    if (i < 2) img.src = src(i);
    frame.appendChild(img); imgs.push(img);
    const d = document.createElement('button');
    d.className = 'dot'; d.setAttribute('aria-label', 'Slide ' + (i + 1));
    d.addEventListener('click', () => go(i));
    dotsEl.appendChild(d); dots.push(d);
  }

  function src(i) { return 'slides/slide-' + String(i + 1).padStart(2, '0') + '.webp'; }
  function ensure(i) { if (i >= 0 && i < N && !imgs[i].src) imgs[i].src = src(i); }

  function go(i) {
    if (i < 0 || i >= N || i === cur && imgs[cur].classList.contains('active')) { if (i !== cur) return; }
    if (i < 0 || i >= N) return;
    imgs[cur].classList.remove('active');
    dots[cur].classList.remove('on');
    cur = i;
    ensure(cur); ensure(cur + 1); ensure(cur - 1);
    imgs[cur].classList.add('active');
    dots[cur].classList.add('on');
    counter.textContent = (cur + 1) + ' / ' + N;
    dots[cur].scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    if (history.replaceState) history.replaceState(null, '', '#' + (cur + 1));
  }

  document.getElementById('prev').addEventListener('click', () => go(cur - 1));
  document.getElementById('next').addEventListener('click', () => go(cur + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N - 1);
    else if (e.key === 'f' || e.key === 'F') toggleFS();
  });

  // touch swipe
  let sx = null, sy = null;
  const viewer = document.getElementById('viewer');
  viewer.addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  viewer.addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.5) go(cur + (dx < 0 ? 1 : -1));
    sx = sy = null;
  }, { passive: true });

  function toggleFS() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  document.getElementById('fs').addEventListener('click', toggleFS);

  document.getElementById('share').addEventListener('click', async () => {
    const data = { title: 'GoviHub Spices — ස්මාර්ට් ගොවිතැන් තාක්ෂණය', url: location.href.split('#')[0] };
    if (navigator.share) { try { await navigator.share(data); } catch (_) {} }
    else { await navigator.clipboard.writeText(data.url); alert('Link copied!'); }
  });

  const h = parseInt(location.hash.slice(1), 10);
  go(!isNaN(h) && h >= 1 && h <= N ? h - 1 : 0);
})();
</script>
</body>
</html>
