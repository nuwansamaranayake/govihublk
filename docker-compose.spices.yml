services:
  govihub-api-spices:
    build:
      context: ./govihub-api
      dockerfile: Dockerfile
    command: gunicorn app.main:app -w 5 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --access-logfile -
    env_file: .env.spices
    environment:
      # Schedulers live on the single-worker MCP service; running them in each of
      # the 5 API workers would duplicate match batches and farmer emails 5x.
      RUN_SCHEDULERS: "false"
    ports:
      - "8003:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres-spices:
        condition: service_healthy
      redis-spices:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.govihub-api-spices.rule=Host(`spices.govihublk.com`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`))"
      - "traefik.http.routers.govihub-api-spices.entrypoints=websecure"
      - "traefik.http.routers.govihub-api-spices.tls.certresolver=letsencrypt"
      - "traefik.http.routers.govihub-api-spices.priority=20"
      - "traefik.http.services.govihub-api-spices.loadbalancer.server.port=8000"
      - "traefik.http.services.govihub-api-spices.loadbalancer.responseForwarding.flushInterval=1ms"
    networks:
      - govihub-spices-net

  govihub-web-spices:
    build:
      context: ./govihub-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://spices.govihublk.com/api/v1
        NEXT_PUBLIC_APP_URL: https://spices.govihublk.com
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: dev-placeholder.apps.googleusercontent.com
    env_file: .env.spices.frontend
    ports:
      - "3003:3000"
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.govihub-web-spices.rule=Host(`spices.govihublk.com`)"
      - "traefik.http.routers.govihub-web-spices.entrypoints=websecure"
      - "traefik.http.routers.govihub-web-spices.tls.certresolver=letsencrypt"
      - "traefik.http.routers.govihub-web-spices.priority=10"
      - "traefik.http.services.govihub-web-spices.loadbalancer.server.port=3000"
    networks:
      - govihub-spices-net

  postgres-spices:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_DB: govihub_spices
      POSTGRES_USER: govihub
      POSTGRES_PASSWORD: ${DB_PASS:-govihub_spices_2026_secure}
    volumes:
      - spices_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U govihub -d govihub_spices"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - govihub-spices-net

  redis-spices:
    image: redis:7-alpine
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - govihub-spices-net

  govihub-spices-admin:
    image: nginx:alpine
    container_name: govihub-spices-admin
    volumes:
      - ./govihub-admin/admin.html:/usr/share/nginx/html/index.html:ro
      - ./govihub-admin/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    networks:
      - govihub-spices-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.spices-admin.rule=Host(`spices.govihublk.com`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.spices-admin.entrypoints=websecure"
      - "traefik.http.routers.spices-admin.tls.certresolver=letsencrypt"
      - "traefik.http.routers.spices-admin.priority=30"
      - "traefik.http.middlewares.spices-admin-strip.stripprefix.prefixes=/admin"
      - "traefik.http.routers.spices-admin.middlewares=spices-admin-strip"
      - "traefik.http.services.spices-admin.loadbalancer.server.port=80"

  # MCP runs alone on a single worker: SSE streaming requires -w 1, and it is
  # also the ONE process that owns the background schedulers. The public URL
  # https://spices.govihublk.com/mcp/sse is unchanged — only which container
  # answers it. Router priority 25 beats the API's 20 so /mcp lands here.
  govihub-mcp-spices:
    build:
      context: ./govihub-api
      dockerfile: Dockerfile
    command: gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker -b 0.0.0.0:8000 --access-logfile -
    env_file: .env.spices
    environment:
      RUN_SCHEDULERS: "true"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres-spices:
        condition: service_healthy
      redis-spices:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.govihub-mcp-spices.rule=Host(`spices.govihublk.com`) && PathPrefix(`/mcp`)"
      - "traefik.http.routers.govihub-mcp-spices.entrypoints=websecure"
      - "traefik.http.routers.govihub-mcp-spices.tls.certresolver=letsencrypt"
      - "traefik.http.routers.govihub-mcp-spices.priority=25"
      - "traefik.http.services.govihub-mcp-spices.loadbalancer.server.port=8000"
      - "traefik.http.services.govihub-mcp-spices.loadbalancer.responseForwarding.flushInterval=1ms"
    networks:
      - govihub-spices-net


volumes:
  spices_pgdata:
    driver: local
  uploads_data:
    driver: local

networks:
  govihub-spices-net:
    driver: bridge
